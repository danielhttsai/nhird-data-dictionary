name: Weekly refetch of MOHW PDFs

on:
  schedule:
    - cron: '0 5 * * 1'   # every Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install pdfplumber httpx selectolax urllib3
      - name: Fetch
        run: python scripts/fetch_pdfs.py
      - name: Extract
        run: python scripts/extract_all.py
      - name: Diff
        run: python scripts/diff_versions.py
      - name: Gap check (garbled / untranslated / referenced-but-unbuilt tables)
        run: python scripts/gap_check.py   # prints to the run log; non-fatal signal
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_pdfs extracted manifest.json qa_report.json diffs_index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh MOHW PDFs (automated)"
            git push
          fi
